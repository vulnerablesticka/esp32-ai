[project]
name = "esp32-ai"
version = "0.1.0"
description = "Memory-efficient PLE model runtime and firmware for ESP32-S3 microcontrollers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "requests>=2.34.2",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
]

# scripts/benchmark_device.py talks to the board over USB serial. Only needed to
# benchmark hardware: uv sync --extra device
[project.optional-dependencies]
device = ["pyserial>=3.5"]
# scripts/chat_ui.py: a Streamlit chat front end for the board's USB serial
# Q&A loop. uv sync --extra chat
chat = ["streamlit>=1.38", "pyserial>=3.5", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Install only reusable PLE modules; experiment code is not packaged.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["model", "quantize"]
